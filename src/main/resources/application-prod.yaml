spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: true
      timeout: 3s

sentry:
  traces-sample-rate: 0.2

logging:
  level:
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info
    org.hibernate.tool.schema: info
    org.springframework.jdbc.datasource.init: info
    org.springframework.web: info
